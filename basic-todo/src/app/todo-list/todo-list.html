
<div class="todo-container">
  <h2>To-do List</h2>

  <input
    type="text"
    [(ngModel)]="newTask"
    placeholder="Enter new task"
    (keyup.enter)="addTask()"/>

  <button class="add-task-button" (click)="addTask()">Add Task</button>

  <p *ngIf="tasks.length === 0">No tasks available. Add a new task.</p>
  <p *ngIf="errorMessage" class="error" style="color: red;">{{ errorMessage }}</p>

  <ul>
    <li *ngFor="let task of tasks; let i=index">
      {{task}}
      <button class="remove-task-button" (click)="removeTask(i)">Remove</button>
    </li>
  </ul>
</div>

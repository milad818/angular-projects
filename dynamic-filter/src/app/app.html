<div class="container">
  <h1 class="title">Dynamic List Filter</h1>

  <input
    type="text"
    placeholder="Insert your keyword..."
    [(ngModel)]="searchTerm"
    class="form-container search-box">

  <ul class="list-group">
    @for (item of filteredItems(); track $index) {
      <li class="list-group-item"> {{ item }} </li>
    } @empty {
      <p>No items found!</p>
    }
  </ul>
</div>
